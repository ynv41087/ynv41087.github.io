<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
        /* Add your CSS here. */
        * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      padding: 20px;
    }

    /* Main Container with the fixed design width constraint */
    .col-100 {
      width: 100%;
      max-width: 1440px;
      background-color: #fff;
      border: 2px solid #ccc;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Shared style for all text cells */
    .cell {
      border: 1px solid #aaa;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #333;
      font-size: 14px;
      min-height: 100px;
    }

    .content {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    /* Rows Configuration */
    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Fixed 200px column with flexible remainder (1fr) */
    .row-1 {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
    }
    </style>
  </head>
  <body>
    <header id="site-header">
      <div class="site-header">
        <div class="col-100">
          header: col-100<br />This entire layout is 1440px wide
        </div>
      </div>
    </header>
    <main>
      <div id="content">
        <div class="row 1">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>

        <div class="row 2">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>

        <div class="row 3">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>
      </div>

      <footer>
        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </footer>
    </main>
  </body>
</html>
