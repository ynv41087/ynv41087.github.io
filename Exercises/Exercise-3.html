<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recreated Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #494545;
      padding: 20px;
    }

    /* Main Container with the fixed design width constraint */
    .layout-container {
      width: 100%;
      max-width: 1440px;
      background-color: #fff;
      border: 2px solid #ccc;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
      top: 50px;
    }

    /* Shared style for all text cells */
    .cell {
      border: 1px solid #aaa;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #333;
      font-size: 14px;
      min-height: 100px;
    }

    .sub-text {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    /* Rows Configuration */
    .row-33 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .row-50 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* Fixed 200px column with flexible remainder (1fr) */
    .row-mixed {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="layout-container">
    
    <!-- Header Row -->
    <div class="cell">
      <strong>header: col-100</strong>
      <span class="sub-text">This entire layout is 1440px wide</span>
    </div>

    <!-- Mixed Row (col-a and col-b) -->
    <div class="row-mixed">
      <div class="cell">col-a</div>
      <div class="cell">
        col-b
        <span class="sub-text">(width 200px)</span>
      </div>
    </div>

    <!-- 50% split Row -->
    <div class="row-50">
      <div class="cell">col-50</div>
      <div class="cell">col-50</div>
    </div>

    <!-- 33% split Row -->
    <div class="row-33">
      <div class="cell">col-33</div>
      <div class="cell">col-33</div>
      <div class="cell">col-33</div>
    </div>

    <!-- Footer Row -->
    <div class="cell">
      <strong>footer: col-100</strong>
    </div>

  </div>

</body>
</html>
