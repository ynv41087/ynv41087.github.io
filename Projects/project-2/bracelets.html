<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructional Site</title>
    <style>
        :root {
            --page-bg: #f5f1f1;
            --header-bg: #f8c8c8;
            --text-dark: #333;
            --card-border: #ddd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--page-bg);
            display: flex;
            justify-content: center;
        }

        .web-container {
            width: 100%;
            max-width: 800px;
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin: 20px 0;
        }

        header {
            background: var(--header-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 28px;
            font-weight: normal;
            margin: 0;
            text-decoration: none;
            color: var(--text-dark);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .circle-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .section-title {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 32px;
            font-weight: normal;
            text-align: center;
            margin: 40px 0 30px 0;
        }

        .bracelet-grid {
            display: flex;
            justify-content: space-around;
            padding: 0 40px;
            margin-bottom: 50px;
            gap: 20px;
            padding-top: 25px;
        }

        .grid-item {
            text-align: center;
            flex: 1;
            min-width: 0;
        }

        .circle-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: #f4f1ef;
        }

        .grid-item p {

            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="web-container">
        <header>
            <a href="index.html" class="logo">Thread and Knots</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about2.html">About</a></li>
                    <li><a href="bracelets.html">Bracelets</a></li>
                    <li><a href= "materials.html">Materials</a></li>
                </ul>
            </nav>
        </header>

         <h2 class="section-title">Choose Your Style</h2>

        <!--Product Grid-->
        <section class="bracelet-grid">
           <div class="grid-item">
                <a href="squareknot.html" aria-label="View Square Knot instructions">
                    <div class="circle-image">
                        <img src="images/ellipse-4.png" alt="Square Knot">
                    </div>
                </a>
                <p>Square Knot</p>
            </div>

            <div class="grid-item">
                <div class="circle-image">
                    <img src="images/ellipse-2.png" alt="Braided knot">
                </div>
                <p>Braided</p>
            </div>

            <div class="grid-item">
                <div class="circle-image">
                    <img src="images/ellipse-3.png" alt="Overhand knot">
                </div>
                <p>Overhand Knot</p>
            </div>
        </section>

    </div>
   
</body>
</html>
