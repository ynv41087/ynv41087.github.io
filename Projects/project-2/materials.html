<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructional Site</title>
    <style>
        :root {
            --page-bg: #f5f1f1;
            --header-bg: #f8c8c8;
            --text-dark: #333;
            --card-border: #ddd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--page-bg);
            display: flex;
            justify-content: center;
        }

        .web-container {
            width: 100%;
            max-width: 800px;
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin: 20px 0;
        }

        header {
            background: var(--header-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 28px;
            font-weight: normal;
            margin: 0;
            color: var(--text-dark);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero-section {
            padding: 0px 0px;
            text-align: center;
        }

        .hero-image-container {
            width: 100%;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
            background: #f3f3f3;
        }
        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-shape {
            position: absolute;
            top: 14%;
            size: 40%;
            left: 405;
            width: 47%;
            height: 15%;
            background: #f8c8c8;
        }

        .text-overlay1 {
            position: absolute;
            left: 50%;
            top: 17%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000000;
    
        }

        .text-overlay2 {
            position: absolute;
            left: 50%;
            top: calc(17% + 40px);
            transform: translateX(-50%);
            width: 80%;
            max-width: 520px;
            color: white;
            font-size: 16px;
            font-weight: normal;
            text-shadow: 1px 1px 2px #000000;
            text-align: center;
        }

        .circle-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .section-title {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
            font-weight: normal;
            margin: 25px 20px 30px 30px;
            padding-bottom: 25px;
        }

        .bracelet-grid {
            display: flex;
            justify-content: space-around;
            padding: 0 40px;
            margin-bottom: 50px;
            gap: 20px;
        }

        .grid-item {
            text-align: center;
            flex: 1;
            min-width: 0;
        }

        .circle-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: #f4f1ef;
        }

        .grid-item p {
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="web-container">
        <header>
            <h1 class="logo">Thread and Knots</h1>
            <nav>
                <ul>
                    <li><a href="instructionalsite.html">Home</a></li>
                    <li><a href="about2.html">About</a></li>
                    <li><a href="bracelets.html">Bracelets</a></li>
                    <li><a href= "materials.html">Materials</a></li>
                </ul>
            </nav>
        </header>

        <!--Main Picture-->
        <section class="hero-section">
            <div class="hero-image-container">
                <img src="images/materials-1.png" alt="Thread and Knots bracelet display">
                <div class="overlay-shape"></div>
                <div class="text-overlay1">Materials</div>
                <div class="text-overlay2">Materials may vary depending on design and will be listed in your bracelet steps. There are optional items you may add to personalize your bracelets.</div>
            </div>
        </section>

        <h3 class="section-title">Needed</h3>

        <!--Product Grid-->
        <section class="bracelet-grid">
            <div class="grid-item">
                <div class="circle-image">
                    <img src="images/ellipse-7.png" alt="Square Knot">
                    
                </div>
                <p>Thread</p>
            </div>

            <div class="grid-item">
                <div class="circle-image">
                    <img src="images/ellipse-8.png" alt="Braided knot">
                </div>
                <p>Clips</p>
            </div>

            <div class="grid-item">
                <div class="circle-image">

                    <img src="images/ellipse-9.png" alt="Overhand knot">
                </div>
                <p>Glue or Lighter</p>
            </div>
        </section>

        <h3 class="section-title">Optional</h3>

         <section class="bracelet-grid">
            <div class="grid-item">
                <div class="circle-image">
                    <img src="images/ellipse-10.png" alt="Square Knot">
                </div>
                <p>Beads</p>
            </div>

            <div class="grid-item">
                <div class="circle-image">
                    <img src="images/ellipse-11.png" alt="Braided knot">
                </div>
                <p>Charms</p>
            </div>
            </section>

        

    </div>
   
</body>
</html>
