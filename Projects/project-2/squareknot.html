<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructional Site</title>
    <style>
        :root {
            --page-bg: #f5f1f1;
            --header-bg: #f8c8c8;
            --text-dark: #333;
            --card-border: #ddd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--page-bg);
            display: flex;
            justify-content: center;
        }

        .web-container {
            width: 100%;
            max-width: 800px;
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin: 20px 0;
        }

        header {
            background: var(--header-bg);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 28px;
            font-weight: normal;
            margin: 0;
            color: var(--text-dark);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero-section {
            padding: 0px 0px;
            text-align: center;
        }

        .hero-image-container {
            width: 100%;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
            background: #f3f3f3;
        }
        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .circle-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .text-overlay {
            position: absolute;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000000;
    
        }

        .section-title {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 32px;
            font-weight: normal;
            text-align: center;
            margin: 25px 0 30px 0;
            padding-bottom: 25px;
        }

        .bracelet-grid {
            display: flex;
            justify-content: space-around;
            padding: 0 40px;
            margin-bottom: 50px;
            gap: 20px;
        }

        .grid-item {
            text-align: center;
            flex: 1;
            min-width: 0;
        }

        .circle-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: #f4f1ef;
        }

        .grid-item p {
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="web-container">
        <header>
            <h1 class="logo">Thread and Knots</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about2.html">About</a></li>
                    <li><a href="bracelets.html">Bracelets</a></li>
                    <li><a href= "materials.html">Materials</a></li>
                </ul>
            </nav>
        </header>


        <h2 class="section-title">Square Knot</h2>


    </div>
   
</body>
</html>
